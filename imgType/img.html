<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>이미지 유형</title>
        <link rel="stylesheet" href="font.css" />
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="img.css" />
    </head>
    <body>
        <section id="imageType">
            <h1 class="blind">이미지 유형 만들기</h1>

            <div class="container">
                <div class="imageType_title">
                    <h2>프리미엄 케이크와 디저트를 만나보세요</h2>
                    <p>유러피언 디저트의 본질을 추구한 고급 원재료와 차별화된 레시피</p>
                </div>

                <div class="imageType_wrap">
                    <div class="imageType_img01">
                        <div class="imageType_txt">
                            <h3>베리밤 레드 케이크</h3>
                            <p>
                                부드럽고 촉촉한 시트 사이에 달콤한 생크림과 신선한 딸기를<br />듬뿍 넣은 케이크입니다.
                                딸기의 상큼함과 생크림의 부드러운 디저트입니다.
                            </p>
                            <a href="#">자세히 보기</a>
                        </div>
                    </div>
                    <div class="imageType_img02">
                        <div class="imageType_txt">
                            <h3>베리밤 초코 케이크</h3>
                            <p>
                                부드럽고 촉촉한 시트 사이에 달콤한 생크림과 신선한 베리를<br />듬뿍 넣은 케이크입니다.
                                초코의 단맛과 생크림의 부드러운 디저트입니다.
                            </p>
                            <a href="#">자세히 보기</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
